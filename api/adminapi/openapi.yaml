openapi: 3.0.0
info:
  title: LINE Messaging API Emulator Admin API
  description: Admin API for managing LINE Messaging API Emulator
  version: 1.0.0
servers:
  - url: http://localhost:9080
    description: Local development server
paths:
  /admin/bots:
    post:
      summary: Create a new bot
      description: Creates a new bot (LINE Official Account) in the emulator
      operationId: createBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
      responses:
        '201':
          description: Bot created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotInfoResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - bot already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/bots/{botId}/followers:
    post:
      summary: Create dummy followers for a bot
      description: Creates dummy followers (users) that follow the specified bot
      operationId: createFollowers
      parameters:
        - name: botId
          in: path
          required: true
          description: Bot's user ID
          schema:
            type: string
            example: "U1234567890abcdef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFollowersRequest'
      responses:
        '201':
          description: Followers created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFollowersResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/bots/{botId}/users/{userId}/events:
    post:
      summary: Act as a user towards a bot
      description: |
        Performs an action as the user and delivers the resulting webhook event to the bot's
        webhook endpoint, signed with the bot's channel secret. The state change is applied
        even when the webhook can't be delivered.
      operationId: sendUserEvent
      parameters:
        - $ref: '#/components/parameters/BotId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendUserEventRequest'
      responses:
        '200':
          description: The action was applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendUserEventResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Bot or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/bots/{botId}/users/{userId}/messages:
    get:
      summary: List messages a user received from a bot
      description: |
        Returns every send request whose recipients include the user, oldest first.
        Broadcast and narrowcast messages are included only while the user follows the bot.
      operationId: listUserMessages
      parameters:
        - $ref: '#/components/parameters/BotId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Messages the user received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserMessagesResponse'
        '404':
          description: Bot or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/bots/{botId}/users/{userId}/rich-menu:
    get:
      summary: Get the rich menu a user sees
      description: |
        Returns the rich menu displayed to the user in the chat with the bot: the per-user
        rich menu when one is linked, otherwise the bot's default rich menu.
      operationId: getUserRichMenu
      parameters:
        - $ref: '#/components/parameters/BotId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The rich menu the user sees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRichMenuResponse'
        '404':
          description: Bot or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    BotId:
      name: botId
      in: path
      required: true
      description: Bot's user ID
      schema:
        type: string
        example: "U1234567890abcdef"
    UserId:
      name: userId
      in: path
      required: true
      description: User's user ID
      schema:
        type: string
        example: "U4af4980629..."
  schemas:
    CreateBotRequest:
      type: object
      required:
        - displayName
      properties:
        basicId:
          type: string
          description: Bot's basic ID
          example: "@example"
        chatMode:
          type: string
          description: |
            Chat settings set in the LINE Official Account Manager.
            - `chat`: Chat is set to "On"
            - `bot`: Chat is set to "Off"
          enum:
            - chat
            - bot
        displayName:
          type: string
          description: Bot's display name
          example: "Example Bot"
        markAsReadMode:
          type: string
          description: |
            Automatic read setting for messages.
            - `auto`: Auto read setting is enabled
            - `manual`: Auto read setting is disabled
          enum:
            - auto
            - manual
        pictureUrl:
          type: string
          format: uri
          description: Profile image URL. Must be an HTTPS URL.
          example: "https://example.com/profile.jpg"
        premiumId:
          type: string
          description: Bot's premium ID
          example: "premium123"
        userId:
          type: string
          description: Bot's user ID
          example: "U1234567890abcdef"
    BotInfoResponse:
      type: object
      required:
        - basicId
        - chatMode
        - displayName
        - markAsReadMode
        - userId
      properties:
        basicId:
          type: string
          description: Bot's basic ID
        chatMode:
          type: string
          description: |
            Chat settings set in the LINE Official Account Manager.
            - `chat`: Chat is set to "On"
            - `bot`: Chat is set to "Off"
          enum:
            - chat
            - bot
        displayName:
          type: string
          description: Bot's display name
        markAsReadMode:
          type: string
          description: |
            Automatic read setting for messages.
            - `auto`: Auto read setting is enabled
            - `manual`: Auto read setting is disabled
          enum:
            - auto
            - manual
        pictureUrl:
          type: string
          format: uri
          description: Profile image URL. HTTPS image URL. Not included if the bot doesn't have a profile image.
        premiumId:
          type: string
          description: Bot's premium ID. Not included if the premium ID isn't set.
        userId:
          type: string
          description: Bot's user ID
    CreateFollowersRequest:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 1000
          description: Number of dummy followers to create
          example: 10
    CreateFollowersResponse:
      type: object
      required:
        - followers
        - count
      properties:
        count:
          type: integer
          description: Number of followers created
          example: 10
        followers:
          type: array
          description: List of created follower profiles
          items:
            $ref: '#/components/schemas/FollowerProfile'
    FollowerProfile:
      type: object
      required:
        - userId
        - displayName
      properties:
        userId:
          type: string
          description: User ID of the follower
          example: "U4af4980629..."
        displayName:
          type: string
          description: Display name of the follower
          example: "LINE taro"
        pictureUrl:
          type: string
          format: uri
          description: Profile image URL. HTTPS image URL. Not included if the user doesn't have a profile image.
          example: "https://example.com/profile.jpg"
        statusMessage:
          type: string
          description: User's status message. Not included if the user doesn't have a status message.
          example: "Hello, LINE!"
        language:
          type: string
          description: User's language
          example: "en"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: Error message
            code:
              type: string
              description: Error code
    SendUserEventRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Action the user performs.
            - `follow`: Adds the bot as a friend
            - `unfollow`: Blocks the bot
            - `message`: Sends a text message. The user must follow the bot.
            - `postback`: Triggers a postback action. The user must follow the bot.
          enum:
            - follow
            - unfollow
            - message
            - postback
        message:
          type: object
          description: Required when type is `message`
          required:
            - text
          properties:
            text:
              type: string
              description: Text of the message
              example: "Hello"
        postback:
          type: object
          description: Required when type is `postback`
          required:
            - data
          properties:
            data:
              type: string
              description: Postback data of the action
              example: "action=buy&itemid=111"
            params:
              type: object
              description: Values selected in a datetime picker or rich menu switch action
              additionalProperties:
                type: string
    SendUserEventResponse:
      type: object
      required:
        - webhookEventId
        - delivered
      properties:
        webhookEventId:
          type: string
          description: ID of the webhook event generated for the action
        replyToken:
          type: string
          description: Reply token of the event. Not included for events that can't be replied to.
        delivered:
          type: boolean
          description: Whether the bot's webhook endpoint accepted the event
        detail:
          type: string
          description: Why the event wasn't delivered. Not included when delivered is true.
    ListUserMessagesResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedMessage'
    ReceivedMessage:
      type: object
      required:
        - id
        - sendType
        - sentAt
        - messages
      properties:
        id:
          type: string
          description: ID of the send request
        sendType:
          type: string
          description: How the bot sent the messages
          enum:
            - push
            - reply
            - multicast
            - narrowcast
            - broadcast
        sentAt:
          type: string
          format: date-time
          description: When the bot sent the messages
        messages:
          type: array
          description: Message objects exactly as the bot sent them
          items:
            type: object
            additionalProperties: true
    UserRichMenuResponse:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          description: |
            Where the displayed rich menu comes from.
            - `user`: A rich menu linked to the user
            - `default`: The bot's default rich menu
            - `none`: The user sees no rich menu
          enum:
            - user
            - default
            - none
        richMenu:
          type: object
          description: Rich menu object exactly as the bot created it, with its richMenuId. Not included when source is `none`.
          additionalProperties: true
